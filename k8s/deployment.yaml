apiVersion: apps/v1
kind: Deployment
metadata:
  name: demoapi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demoapi
  template:
    metadata:
      labels:
        app: demoapi
    spec:
      containers:
        - name: demoapi
          image: demoapi:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: demoapi
spec:
  selector:
    app: demoapi
  ports:
    - port: 80
      targetPort: 5000
